name: Build

# Builds the Windows installer on a Windows runner. Run it from the Actions tab
# (workflow_dispatch) or by pushing a version tag like v1.0.0. The installer is
# uploaded as a build artifact, and put on the release when a tag was pushed or
# a release tag was given, so people can download it with one press.
#
# The Mac build is done locally, not here: the Apple Intelligence engine (afm)
# must be compiled on macOS 26+ with the FoundationModels SDK, which the hosted
# macOS runners do not yet have. On Windows KAI runs on the Ollama fallback plus
# the local knowledge base, so no native helper is needed.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to attach OutPast-Setup.exe to (empty to only build)
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: KAI's engine and model
        run: node scripts/fetch-kai.mjs win32 x64

      - name: Check Windows can speak
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\\voice.wav")
          $s.Speak("Welcome sir. Ready to outperform, outsmart, and out past.")
          $s.Dispose()
          $len = (Get-Item "$PWD\\voice.wav").Length
          Write-Host "voice.wav $len bytes"
          if ($len -lt 20000) { throw "the Windows voice produced nothing" }

      - name: Build Windows installer
        run: npm run build:win
        env:
          # No code-signing cert in CI; ship an unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Out Past's own Google client, so nobody is asked for a key
          OUTPAST_GOOGLE_CLIENT_ID: ${{ secrets.OUTPAST_GOOGLE_CLIENT_ID }}
          OUTPAST_GOOGLE_CLIENT_SECRET: ${{ secrets.OUTPAST_GOOGLE_CLIENT_SECRET }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: out-past-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

      - name: Put it on the release
        if: ${{ inputs.release != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release != '' && inputs.release || github.ref_name }}
        # a 1.2 GB upload sometimes answers 404 after it has actually landed,
        # so the check is whether the file is on the release, not the exit code
        run: |
          gh release upload "$TAG" release/OutPast-Setup.exe --clobber || echo "upload reported an error, checking the release"
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx OutPast-Setup.exe
